<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PhysiTAI</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this for any unknown path (e.g. a direct load of
      // /about or a refresh on it). It re-encodes the path into a query
      // string and redirects to index.html, which decodes it back before
      // the router reads the URL. pathSegmentsToKeep=1 keeps the "/physitai"
      // project-page segment; update this if the deployment path changes.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
